[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solsrngcore-windows-ahk"
version = "0.5.0"
description = "Windows-first Sol's RNG macro core with pixel detection, resolution-aware calibration, pixel fishing and AutoHotkey 1.1 input"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
