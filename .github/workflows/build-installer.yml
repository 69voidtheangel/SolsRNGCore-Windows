name: Build and publish SolsRNGCore Windows artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "PyInstaller>=6,<7"

      - name: Windows-only background input smoke test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD\src"
          python -c "from solsrng_core.antiafk.backends import WindowsInputBackend; from solsrng_core.automation.windows_background import WindowsBackgroundInput; import sys; assert sys.platform == 'win32'; assert 'solsrng_core.antiafk.backends.xdotool' not in sys.modules; assert 'solsrng_core.antiafk.backends.ydotool' not in sys.modules; assert WindowsBackgroundInput is not None; assert WindowsInputBackend is not None"

      - name: Build single-file application EXE
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm solsrngcore_windows.spec
          if (!(Test-Path 'dist/SolsRNGCore.exe')) { throw 'SolsRNGCore.exe was not produced.' }

      - name: Verify application EXE
        shell: pwsh
        run: |
          $exe = Get-Item 'dist/SolsRNGCore.exe'
          if ($exe.Length -lt 1000000) { throw "SolsRNGCore.exe is unexpectedly small: $($exe.Length) bytes" }
          Write-Host "Built $($exe.FullName) ($($exe.Length) bytes)"

      - name: Build installer EXE
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $issc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $issc)) {
            $issc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          }
          if (!(Test-Path $issc)) { throw 'Inno Setup compiler (ISCC.exe) was not found.' }
          & $issc installer.iss
          if (!(Test-Path 'installer/output/SolsRNGCore-Setup.exe')) { throw 'SolsRNGCore-Setup.exe was not produced.' }

      - name: Upload normal application EXE
        uses: actions/upload-artifact@v4
        with:
          name: SolsRNGCore-EXE
          path: dist/SolsRNGCore.exe
          if-no-files-found: error

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolsRNGCore-Setup
          path: installer/output/SolsRNGCore-Setup.exe
          if-no-files-found: error

      - name: Replace repository with installer only
        shell: pwsh
        run: |
          Copy-Item 'installer/output/SolsRNGCore-Setup.exe' 'SolsRNGCore-Setup.exe' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch -- .
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' -and $_.Name -ne 'SolsRNGCore-Setup.exe' } | Remove-Item -Recurse -Force
          git add 'SolsRNGCore-Setup.exe'
          git commit -m 'Publish updated SolsRNGCore Windows installer'
          git push origin HEAD:main
