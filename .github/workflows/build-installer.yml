name: Build and publish SolsRNGCore Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build single-file application EXE
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "PyInstaller>=6,<7"
          python -m PyInstaller --clean --noconfirm solsrngcore_windows.spec
          if (!(Test-Path 'dist/SolsRNGCore.exe')) { throw 'SolsRNGCore.exe was not produced.' }

      - name: Build installer EXE
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe" installer.iss
          if (!(Test-Path 'installer/output/SolsRNGCore-Setup.exe')) { throw 'SolsRNGCore-Setup.exe was not produced.' }

      - name: Replace repository with installer only
        shell: pwsh
        run: |
          Copy-Item 'installer/output/SolsRNGCore-Setup.exe' 'SolsRNGCore-Setup.exe' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch -- .
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' -and $_.Name -ne 'SolsRNGCore-Setup.exe' } | Remove-Item -Recurse -Force
          git add 'SolsRNGCore-Setup.exe'
          git commit -m 'Publish SolsRNGCore Windows installer'
          git push origin HEAD:main
