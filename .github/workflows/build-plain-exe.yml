name: Build Plain EXE

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/build-now.trigger

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt 'PyInstaller>=6,<7'

      - name: Build single-file EXE
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist, build -ErrorAction SilentlyContinue
          pyinstaller --clean --noconfirm --onefile --windowed `
            --name SolsRNGCore `
            --paths src `
            --add-data 'assets/solsrng_core_logo.svg;assets' `
            --add-data 'library;library' `
            main.py

      - name: Replace repository with plain EXE
        shell: pwsh
        run: |
          Copy-Item 'dist/SolsRNGCore.exe' './SolsRNGCore.exe' -Force
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r --ignore-unmatch -- . ':!.git' ':!SolsRNGCore.exe'
          Get-ChildItem -Force | Where-Object { $_.Name -ne '.git' -and $_.Name -ne 'SolsRNGCore.exe' } | Remove-Item -Recurse -Force
          git add -A
          git commit -m 'Replace source tree with compiled SolsRNGCore.exe'
          git push origin HEAD:main
