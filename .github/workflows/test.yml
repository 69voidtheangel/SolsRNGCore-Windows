name: Windows repository validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate AHK 1.1 bridge
        shell: pwsh
        run: |
          $ahk = Get-Content -Raw ahk/SolsRNGCore-Windows.ahk
          if ($ahk -match '#Requires AutoHotkey v2') { throw 'AHK v2 directive found.' }
          foreach ($needle in @('SendMode,', 'SetKeyDelay,', 'SetMouseDelay,', 'IniRead,', 'Hotkey,', 'RELOAD_SETTINGS', 'EMERGENCY_STOP')) {
            if ($ahk -notmatch [regex]::Escape($needle)) { throw "Missing AHK feature: $needle" }
          }
      - name: Validate version metadata
        shell: pwsh
        run: |
          if ((Get-Content -Raw VERSION.txt).Trim() -notmatch '^0.6.0') { throw 'Version metadata mismatch.' }
          if ((Get-Content -Raw VERSION.txt) -notmatch 'AHK=1.1') { throw 'AHK version metadata mismatch.' }
          if ((Get-Content -Raw SOURCE_SNAPSHOT.md) -notmatch 'b390ea1d4d1ef13677e09aa316633ab52c319e89857c203398a6499f4e380aca') { throw 'Snapshot hash mismatch.' }
      - name: Validate required release docs
        shell: pwsh
        run: |
          foreach ($path in @('README.md','CHANGELOG.md','ENDSOL_FEATURES.md','docs/AHK.md','docs/SIMULATOR.md','V0.6.0_UPDATE.md')) {
            if (!(Test-Path $path)) { throw "Missing release file: $path" }
          }
